<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>ALTP OBS Screen - WinUI 3.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* SETUP 1920x1080 SAFE ZONE & FONT */
        body, html { 
            margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; 
            background-color: transparent; font-family: 'Inter', 'Segoe UI', sans-serif; 
        }

        /* --- ANIMATIONS --- */
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 50% { transform: scale(1.02); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes slideInRight { 0% { transform: translateX(50px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        @keyframes blinkCorrect { 0%, 50%, 100% { background: linear-gradient(180deg, #2ecc71 0%, #27ae60 100%); } 25%, 75% { background: linear-gradient(180deg, #001f54 0%, #00001a 100%); } }
        @keyframes pulseOrange { 0% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(230, 126, 34, 0); } 100% { box-shadow: 0 0 0 0 rgba(230, 126, 34, 0); } }

        .anim-pop { animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .anim-slide { animation: slideInRight 0.4s ease-out forwards; }

        /* --- TÊN HỌC SINH (CENTER TOP - TRONG VÙNG AN TOÀN) --- */
        #student-name {
            display: none; position: absolute; 
            top: 8%; /* Đẩy lên trên cùng, cách viền 8% */
            left: 50%; transform: translateX(-50%); /* Căn giữa hoàn hảo */
            font-size: 45px; font-weight: 700; color: #ffffff; text-transform: uppercase; letter-spacing: 3px;
            background: rgba(0, 31, 84, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 16px; padding: 20px 60px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px rgba(212, 175, 55, 0.3); text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            z-index: 100;
        }

        /* --- KHUNG CÂU HỎI & ĐÁP ÁN --- */
        #main-ui { display: none; position: absolute; bottom: 120px; left: 10%; width: 80%; }

        /* SỢI CHỈ KIM LOẠI (Nền sau) */
        .bg-line {
            position: absolute; top: 50%; transform: translateY(-50%);
            left: -30vw; right: -30vw; height: 4px; z-index: -1; 
            background: linear-gradient(90deg, transparent 0%, #d4af37 20%, #ffdf70 50%, #d4af37 80%, transparent 100%);
            box-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        .q-wrap, .ans-row { position: relative; width: 100%; display: flex; justify-content: center; z-index: 10; }
        .q-wrap { margin-bottom: 25px; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .ans-row { gap: 25px; margin-bottom: 20px; align-items: stretch; }

        .altp-shape {
            position: relative; background: #d4af37; padding: 3px;
            clip-path: polygon(3% 0, 97% 0, 100% 50%, 97% 100%, 3% 100%, 0% 50%);
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            display: flex; flex-direction: column;
        }
        .question-shape { width: 100%; }
        .ans-shape { flex: 1; }

        .altp-inner {
            background: linear-gradient(180deg, #001f54 0%, #00001a 100%);
            clip-path: polygon(3% 0, 97% 0, 100% 50%, 97% 100%, 3% 100%, 0% 50%);
            color: white; padding: 20px 50px; display: flex; align-items: center; transition: all 0.4s ease;
            flex: 1; 
        }
        
        #question-text { font-size: 34px; font-weight: 600; text-align: center; justify-content: center; min-height: 55px; }
        
        .ans-inner { justify-content: flex-start; padding-left: 60px; font-size: 30px; font-weight: 600; }
        .ans-letter { color: #d4af37; font-weight: 700; margin-right: 15px; font-size: 32px; }

        /* Trạng thái màu sắc */
        .bg-orange { background: linear-gradient(180deg, #e67e22 0%, #d35400 100%) !important; color: white !important; animation: pulseOrange 1.5s infinite; }
        .bg-green { animation: blinkCorrect 1.5s ease-in-out forwards !important; color: white !important; }
        .bg-red { background: linear-gradient(180deg, #e74c3c 0%, #c0392b 100%) !important; color: white !important; }

        /* --- RIGHT SIDEBAR --- */
        #sidebar-ui {
            display: none; position: absolute; right: 40px; top: 50px; width: 340px;
            background: rgba(0, 10, 30, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .lifelines { display: flex; justify-content: space-between; margin-bottom: 25px; }
        .lifeline-icon { 
            width: 60px; height: 60px; background: rgba(0, 31, 84, 0.8); border: 2px solid #6699ff; border-radius: 50%; display: flex; align-items: center; 
            justify-content: center; color: white; font-weight: bold; font-size: 24px; box-shadow: inset 0 2px 5px rgba(255,255,255,0.2); transition: all 0.3s;
        }
        .lifeline-icon.used { opacity: 0.3; border-color: #ff4d4d; position: relative; }
        .lifeline-icon.used::after { content: '✖'; position: absolute; color: #ff4d4d; font-size: 35px; font-weight: bold; text-shadow: 0 0 5px black; }
        
        .levels { text-align: right; color: #d4af37; font-size: 26px; font-weight: 700; line-height: 1.8; display: flex; flex-direction: column; gap: 4px; }
        .level-item { transition: all 0.3s; padding: 0 10px; border-radius: 6px; }
        .level-item.active { background: #d4af37; color: #000; box-shadow: 0 0 15px rgba(212, 175, 55, 0.6); transform: scale(1.05); transform-origin: right; }
        .level-item.milestone { color: #ffffff; }
    </style>
</head>
<body>
    <div id="student-name"></div>

    <div id="sidebar-ui">
        <div class="lifelines">
            <div id="ll-5050" class="lifeline-icon">50</div>
            <div id="ll-phone" class="lifeline-icon">☎</div>
            <div id="ll-audience" class="lifeline-icon">👥</div>
            <div id="ll-wise" class="lifeline-icon">🎓</div>
        </div>
        <div class="levels" id="level-list"></div>
    </div>

    <div id="main-ui">
        <div class="q-wrap" id="q-wrap">
            <div class="bg-line"></div>
            <div class="altp-shape question-shape">
                <div class="altp-inner" id="question-text"></div>
            </div>
        </div>

        <div id="ans-wrapper" style="transition: all 0.5s ease;">
            <div class="ans-row">
                <div class="bg-line"></div>
                <div class="altp-shape ans-shape" id="wrap-A"><div class="altp-inner ans-inner" id="ans-A"><span class="ans-letter">A:</span> <span id="text-A"></span></div></div>
                <div class="altp-shape ans-shape" id="wrap-B"><div class="altp-inner ans-inner" id="ans-B"><span class="ans-letter">B:</span> <span id="text-B"></span></div></div>
            </div>
            <div class="ans-row">
                <div class="bg-line"></div>
                <div class="altp-shape ans-shape" id="wrap-C"><div class="altp-inner ans-inner" id="ans-C"><span class="ans-letter">C:</span> <span id="text-C"></span></div></div>
                <div class="altp-shape ans-shape" id="wrap-D"><div class="altp-inner ans-inner" id="ans-D"><span class="ans-letter">D:</span> <span id="text-D"></span></div></div>
            </div>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const socket = io();
        const player = document.getElementById('audio-player');

        function triggerAnimation(elementId, animClass) {
            const el = document.getElementById(elementId);
            if (!el) return;
            el.classList.remove(animClass);
            void el.offsetWidth; 
            el.classList.add(animClass);
        }

        socket.on('sync_obs', function(data) {
            const cmd = data.command;
            
            if (cmd === 'show_student') {
                // Đã gỡ lệnh ẩn main-ui ở đây để 2 cái có thể hiện song song
                const nameEl = document.getElementById('student-name');
                nameEl.innerText = data.name; nameEl.style.display = 'block';
                triggerAnimation('student-name', 'anim-pop');
            }
            if (cmd === 'hide_student') document.getElementById('student-name').style.display = 'none';
            
            if (cmd === 'load_question') {
                // Đã gỡ lệnh ẩn student-name ở đây
                const ansWrap = document.getElementById('ans-wrapper');
                ansWrap.style.opacity = '1'; 
                ansWrap.style.transform = 'translateY(0)'; 
                ansWrap.style.pointerEvents = 'auto';

                const qWrap = document.getElementById('q-wrap');
                qWrap.style.transform = 'translateY(0)'; 
                
                const qText = document.getElementById('question-text');
                qText.style.fontSize = '34px';
                qText.style.color = 'white';

                document.getElementById('main-ui').style.display = 'block';
                triggerAnimation('main-ui', 'anim-pop');
                qText.innerText = data.q.question;
                
                ['A','B','C','D'].forEach(key => {
                    document.getElementById(`text-${key}`).innerText = data.q.options[key];
                    let el = document.getElementById(`ans-${key}`);
                    el.className = 'altp-inner ans-inner'; 
                    document.getElementById(`wrap-${key}`).style.visibility = 'visible'; 
                });
                renderLevels(data.q.level);
            }
            
            if (cmd === 'hide_question') document.getElementById('main-ui').style.display = 'none';

            if (cmd === 'show_prize') {
                const ansWrap = document.getElementById('ans-wrapper');
                ansWrap.style.opacity = '0'; 
                ansWrap.style.transform = 'translateY(50px)'; 
                ansWrap.style.pointerEvents = 'none';

                const qWrap = document.getElementById('q-wrap');
                qWrap.style.transform = 'translateY(90px)'; 

                const qText = document.getElementById('question-text');
                qText.innerText = data.milestone; 
                qText.style.fontSize = '50px';
                qText.style.color = '#ffdf70'; 
            }

            if (cmd === 'highlight_answer') {
                ['A','B','C','D'].forEach(k => document.getElementById(`ans-${k}`).classList.remove('bg-orange'));
                document.getElementById(`ans-${data.selected}`).classList.add('bg-orange');
            }
            if (cmd === 'show_result') {
                document.getElementById(`ans-${data.selected}`).classList.remove('bg-orange');
                document.getElementById(`ans-${data.correct}`).classList.add('bg-green');
                if(data.selected !== data.correct) document.getElementById(`ans-${data.selected}`).classList.add('bg-red');
            }
            if (cmd === 'play_audio' && data.file) { player.src = '/static/audio/' + data.file; player.play(); }
            if (cmd === 'stop_audio') { player.pause(); player.currentTime = 0; }
            if (cmd === 'use_lifeline') {
                document.getElementById(`ll-${data.type}`).classList.add('used');
                if(data.type === '5050') {
                    document.getElementById(`wrap-${data.hide1}`).style.visibility = 'hidden';
                    document.getElementById(`wrap-${data.hide2}`).style.visibility = 'hidden';
                }
            }
            if (cmd === 'toggle_sidebar') {
                const sidebar = document.getElementById('sidebar-ui');
                if (data.state) { 
                    sidebar.style.display = 'block'; 
                    triggerAnimation('sidebar-ui', 'anim-slide'); 
                    // Tự động tắt cụm câu hỏi khi mở Sidebar theo đúng yêu cầu
                    document.getElementById('main-ui').style.display = 'none';
                } 
                else {
                    sidebar.style.display = 'none';
                }
            }
        });

        function renderLevels(currentLvl) {
            let html = '';
            for(let i=15; i>=1; i--) {
                let cls = (i === currentLvl) ? 'level-item active' : 'level-item';
                if(i%5===0 && i!==currentLvl) cls += ' milestone';
                html += `<div class="${cls}">${i} ◈ MỨC ${i}</div>`;
            }
            document.getElementById('level-list').innerHTML = html;
        }

        renderLevels(0); 
    </script>
</body>
</html>
